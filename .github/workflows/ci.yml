name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (matches the project's target JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Run all tests with the 'test' profile (uses H2 in-memory database)
      # This step will fail the entire pipeline if any test fails.
      - name: Run tests
        working-directory: demo
        run: mvn clean test -Dspring.profiles.active=test --batch-mode --no-transfer-progress

      # Step 4: Generate JaCoCo coverage report (always runs, even if tests fail, for visibility)
      - name: Generate coverage report
        if: always()
        working-directory: demo
        run: mvn jacoco:report --batch-mode --no-transfer-progress

      # Step 5: Upload coverage report as a build artifact for inspection
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: demo/target/site/jacoco/
          retention-days: 7

      # Step 6: Upload test results for GitHub test reporting
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-results
          path: demo/target/surefire-reports/
          retention-days: 7
